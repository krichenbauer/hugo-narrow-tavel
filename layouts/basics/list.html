{{ define "main" }}
  <section class="w-full">
    <header class="mb-8 space-y-3">
      <h1 class="text-3xl font-bold">{{ .Title }}</h1>
      {{ with .Summary }}
        <p class="text-muted-foreground max-w-3xl text-base md:text-lg">{{ . }}</p>
      {{ end }}
      {{ with .Content }}
        <div class="prose prose-neutral dark:prose-invert max-w-none">{{ . }}</div>
      {{ end }}
    </header>

    {{ $pages := .Pages.ByWeight }}
    {{ if gt (len $pages) 0 }}
      <div class="space-y-4">
        {{ range $pages }}
          {{ partial "basics/card.html" (dict "page" .) }}
        {{ end }}
      </div>
    {{ end }}
  </section>
{{ end }}
