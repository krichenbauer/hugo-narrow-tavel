{{ define "main" }}
  <article class="mx-auto w-full px-4 py-6">
    <header class="mb-6 space-y-3">
      <h1 class="text-3xl font-bold md:text-4xl">{{ .Title }}</h1>
      {{ with .Summary }}
        <p class="text-muted-foreground max-w-3xl text-base md:text-lg">{{ . }}</p>
      {{ end }}
    </header>

    <div class="prose prose-neutral max-w-none dark:prose-invert">
      {{ .Content }}
    </div>
  </article>
{{ end }}
