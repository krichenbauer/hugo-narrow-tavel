{{ define "main" }}
  <section class="w-full">
    <header class="mb-8">
      <h1 class="mb-3 text-3xl font-bold">{{ .Title }}</h1>
      {{ with .Content }}
        <div class="prose prose-neutral dark:prose-invert max-w-none">{{ . }}</div>
      {{ end }}
    </header>

    {{ $areas := .Pages.ByWeight }}
    {{ if gt (len $areas) 0 }}
      <div class="space-y-4">
        {{ range $areas }}
          {{ partial "areas/card.html" (dict "page" .) }}
        {{ end }}
      </div>
    {{ end }}
  </section>
{{ end }}
