{{ define "main" }}
  <section class="w-full">
    <header class="mb-8">
      <h1 class="mb-2 text-3xl font-bold">{{ .Title }}</h1>
    </header>

    {{ if gt (len .Data.Terms) 0 }}
      <div class="grid gap-4 sm:grid-cols-2">
        {{ range .Data.Terms.Alphabetical }}
          {{ partial "categories/tile.html" (dict "page" .Page "count" .Count) }}
        {{ end }}
      </div>
    {{ end }}
  </section>
{{ end }}
