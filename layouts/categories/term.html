{{ define "main" }}
  <section class="w-full">
    <header class="mb-8">
      <h1 class="mb-2 text-3xl font-bold">{{ .Title }}</h1>
    </header>

    {{ $pages := .Pages }}

    {{ if gt (len $pages) 0 }}
      <div class="space-y-4">
        {{ range $pages }}
          {{ partial "places/card.html" (dict "page" .) }}
        {{ end }}
      </div>
    {{ end }}
  </section>
{{ end }}
