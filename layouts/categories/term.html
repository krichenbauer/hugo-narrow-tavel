{{ define "main" }}
  <section class="mx-auto px-4 py-6">
    <header class="mb-8">
      <h1 class="mb-2 text-3xl font-bold">{{ .Title }}</h1>
      <p class="text-muted-foreground">Orte in dieser Kategorie.</p>
    </header>

    {{ $pages := .Pages }}

    {{ if gt (len $pages) 0 }}
      <div class="space-y-4">
        {{ range $pages }}
          {{ partial "places/card.html" (dict "page" .) }}
        {{ end }}
      </div>
    {{ else }}
      <p class="text-muted-foreground">In dieser Kategorie sind noch keine Orte vorhanden.</p>
    {{ end }}
  </section>
{{ end }}
