{{ define "main" }}
  <section class="mx-auto px-4 py-6">
    <header class="mb-8">
      <h1 class="mb-3 text-3xl font-bold">{{ .Title }}</h1>
      {{ with .Content }}
        <div class="prose prose-neutral dark:prose-invert max-w-none">{{ . }}</div>
      {{ end }}
    </header>

    <div class="space-y-4">
      {{ range partial "places/sort-by-weight.html" .Pages }}
        {{ partial "places/card.html" (dict "page" .) }}
      {{ end }}
    </div>
  </section>
{{ end }}
