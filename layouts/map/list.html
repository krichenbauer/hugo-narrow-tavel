{{ define "main" }}
  <section class="mx-auto px-4 py-6">
    <header class="mb-6">
      <h1 class="mb-2 text-3xl font-bold">{{ .Title }}</h1>
      {{ with .Content }}
        <div class="prose prose-neutral max-w-none dark:prose-invert">{{ . }}</div>
      {{ end }}
    </header>

    <div class="rounded-xl border border-neutral-200 bg-white p-3">
      <div id="travel-map" class="travel-map" aria-label="Map of places"></div>
    </div>

    <noscript>
      <p class="mt-3 text-sm text-neutral-700">The interactive map requires JavaScript.</p>
    </noscript>
  </section>

  <link rel="stylesheet" href="{{ "vendor/leaflet/leaflet.css" | relURL }}" />
  <script>
    window.travelMapDataUrl = "{{ .RelPermalink }}index.json";
  </script>
  <script src="{{ "vendor/leaflet/leaflet.js" | relURL }}"></script>
  <script src="{{ "js/travel-map.js" | relURL }}"></script>
{{ end }}
