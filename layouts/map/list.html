{{ define "main" }}
  <section class="mx-auto px-4 py-6">
    <header class="mb-6">
      <h1 class="mb-2 text-3xl font-bold">{{ .Title }}</h1>
      {{ with .Content }}
        <div class="prose prose-neutral max-w-none dark:prose-invert">{{ . }}</div>
      {{ end }}
    </header>

    <div class="bg-card border-border rounded-xl border p-3">
      <div id="travel-map" class="travel-map" aria-label="Karte der Orte"></div>
    </div>

    <section class="travel-map-legend mt-4" aria-label="Legende fuer Kartenmarker">
      <h2 class="mb-2 text-sm font-semibold">Legende</h2>
      <ul class="grid gap-2 text-sm sm:grid-cols-2 lg:grid-cols-3">
        <li class="travel-map-legend-item">
          <span class="travel-map-dot travel-map-dot-area" aria-hidden="true"></span>
          <span>Gebiete</span>
        </li>
        <li class="travel-map-legend-item">
          <span class="travel-map-dot travel-map-dot-sightseeing" aria-hidden="true"></span>
          <span>Sehenswuerdigkeiten</span>
        </li>
        <li class="travel-map-legend-item">
          <span class="travel-map-dot travel-map-dot-viewpoint" aria-hidden="true"></span>
          <span>Aussichtspunkte</span>
        </li>
        <li class="travel-map-legend-item">
          <span class="travel-map-dot travel-map-dot-food" aria-hidden="true"></span>
          <span>Essen</span>
        </li>
        <li class="travel-map-legend-item">
          <span class="travel-map-dot travel-map-dot-restaurant" aria-hidden="true"></span>
          <span>Restaurant</span>
        </li>
        <li class="travel-map-legend-item">
          <span class="travel-map-dot travel-map-dot-other" aria-hidden="true"></span>
          <span>Weitere Kategorien</span>
        </li>
      </ul>
      <p class="text-muted-foreground mt-2 text-xs">Die Markerfarben sind auf gute Unterscheidbarkeit bei Rot-Gruen-Sehschwaeche abgestimmt.</p>
    </section>

    <noscript>
      <p class="text-muted-foreground mt-3 text-sm">Die interaktive Karte benoetigt JavaScript.</p>
    </noscript>
  </section>

  <link rel="stylesheet" href="{{ "vendor/leaflet/leaflet.css" | relURL }}" />
  <script>
    window.travelMapDataUrl = "{{ .RelPermalink }}index.json";
  </script>
  <script src="{{ "vendor/leaflet/leaflet.js" | relURL }}"></script>
  <script src="{{ "js/travel-map.js" | relURL }}"></script>
{{ end }}
