{{ $id := .id | default "disqus-comments" }}
{{ $config := .Site.Params.comments.disqus }}

{{ if $config.shortname }}
  <div id="{{ $id }}" class="disqus-container">
    <div id="disqus_thread"></div>

    <script>
      (function() {
        'use strict';

        var disqus_config = function () {
          this.page.url = '{{ .Permalink }}';
          this.page.identifier = '{{ .RelPermalink }}';
          this.page.title = '{{ .Title | safeJS }}';
        };

        function loadDisqus() {
          var d = document, s = d.createElement('script');
          s.src = 'https://{{ $config.shortname }}.disqus.com/embed.js';
          s.setAttribute('data-timestamp', +new Date());
          (d.head || d.body).appendChild(s);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', loadDisqus);
        } else {
          loadDisqus();
        }
      })();
    </script>

    <noscript>
      {{ partial "features/comments/notice.html" (dict "icon" "message-circle") }}
    </noscript>
  </div>
{{ else }}
  {{ partial "features/comments/notice.html" (dict "id" $id "icon" "message-circle") }}
{{ end }}
